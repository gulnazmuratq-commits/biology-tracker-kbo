<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Трекер силлабуса КВО · Биология</title><style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#E9E6DA;
    --paper-2:#F3F1E6;
    --ink:#232420;
    --ink-soft:#65614E;
    --line:#D8D2BE;
    --green:#3F6B4F;
    --amber:#B8863B;
    --todo:#BEB8A4;
    --g7:#4F7350;
    --g7-bg:#E8EFE4;
    --g8:#3B5A73;
    --g8-bg:#E6ECF1;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:720px; margin:0 auto; padding:30px 18px 90px; }

  h1.page-title{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:clamp(1.5rem,4.5vw,2rem);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .page-sub{ color:var(--ink-soft); font-size:0.93rem; max-width:60ch; margin:0 0 24px; }

  .hero{ display:flex; align-items:flex-end; gap:18px; margin-bottom:22px; flex-wrap:wrap; }
  .hero-num{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(2.4rem,10vw,3.4rem); line-height:1; white-space:nowrap; }
  .hero-side{ flex:1 1 160px; min-width:140px; padding-bottom:6px; }
  .hero-label{ color:var(--ink-soft); font-size:0.82rem; margin-bottom:6px; }
  .hero-bar{ height:8px; border-radius:5px; background:var(--line); overflow:hidden; }
  .hero-fill{ height:100%; background:var(--ink); border-radius:5px; transition:width .4s ease; }

  .roster-card{ border:1px solid var(--line); border-radius:10px; background:var(--paper-2); margin-bottom:26px; overflow:hidden; }
  .roster-row{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .roster-row:first-child{ border-top:none; }
  .roster-name{ flex:1 1 120px; text-align:left; background:none; border:none; font-family:'Inter'; font-weight:600; font-size:.95rem; color:var(--ink); cursor:pointer; padding:2px 0; }
  .roster-grades{ display:flex; gap:14px; flex:0 0 auto; }
  .roster-grade-stat{ display:flex; flex-direction:column; gap:3px; width:80px; }
  .roster-grade-label{ font-size:.68rem; color:var(--ink-soft); white-space:nowrap; }
  .roster-grade-bar{ height:5px; border-radius:4px; background:var(--line); overflow:hidden; }
  .roster-grade-fill{ height:100%; border-radius:4px; transition:width .3s ease; }
  .roster-grade-fill.g7{ background:var(--g7); }
  .roster-grade-fill.g8{ background:var(--g8); }
  .roster-remove{ font-size:.72rem; color:var(--ink-soft); background:none; border:1px solid var(--line); border-radius:16px; padding:4px 11px; cursor:pointer; white-space:nowrap; }
  .roster-remove.confirm{ color:#8a2e2e; border-color:#8a2e2e; }
  .roster-empty{ padding:16px 14px; color:var(--ink-soft); font-size:.9rem; }

  .add-row{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); }
  .add-input{ flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:'Inter'; font-size:.9rem; background:var(--paper); color:var(--ink); }
  .add-input:focus{ outline:2px solid var(--ink-soft); outline-offset:1px; }
  .add-btn{ border:1px solid var(--ink); background:var(--ink); color:var(--paper-2); border-radius:8px; padding:9px 16px; font-size:.85rem; cursor:pointer; white-space:nowrap; font-family:'Inter'; font-weight:600; }

  .back-btn{ font-size:.83rem; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:0 0 12px; display:inline-flex; align-items:center; gap:4px; font-family:'Inter'; }
  .student-head{ margin-bottom:16px; }
  .student-name{ font-family:'Fraunces',serif; font-weight:600; font-size:1.4rem; margin:0 0 4px; }
  .student-sub{ color:var(--ink-soft); font-size:.86rem; margin:0; }

  .tabs{ display:flex; gap:10px; margin-bottom:16px; }
  .tab-btn{ flex:1; text-align:left; border:1px solid var(--line); background:var(--paper-2); border-radius:10px; padding:10px 14px; cursor:pointer; font-family:'Inter'; color:var(--ink); }
  .tab-btn .tname{ font-weight:600; display:block; font-size:.94rem; }
  .tab-btn .tstat{ font-size:.78rem; color:var(--ink-soft); }
  .tab-btn[data-grade="7"].active{ background:var(--g7-bg); border-color:var(--g7); }
  .tab-btn[data-grade="7"].active .tname{ color:var(--g7); }
  .tab-btn[data-grade="8"].active{ background:var(--g8-bg); border-color:var(--g8); }
  .tab-btn[data-grade="8"].active .tname{ color:var(--g8); }

  .legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:.78rem; color:var(--ink-soft); margin:2px 0 20px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot-sample{ width:12px;height:12px;border-radius:50%; display:inline-block; border:2px solid var(--todo); }
  .dot-sample.doing{ border-color:var(--amber); background:linear-gradient(90deg,var(--amber) 50%,transparent 50%); }
  .dot-sample.done{ border-color:var(--green); background:var(--green); }
  .legend .hint{ color:var(--ink-soft); }

  .block{ border:1px solid var(--line); border-left:4px solid var(--accent,var(--line)); border-radius:10px; background:var(--paper-2); margin-bottom:14px; overflow:hidden; }
  .block-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px 8px; flex-wrap:wrap; }
  .block-title-wrap{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .block-title{ font-family:'Fraunces',serif; font-weight:600; font-size:1.04rem; margin:0; }
  .kbo-tag{ font-size:.70rem; color:var(--ink-soft); border:1px solid var(--line); border-radius:20px; padding:1px 8px; white-space:nowrap; }
  .block-progress{ display:flex; align-items:center; gap:8px; }
  .mini-bar{ width:64px; height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .mini-fill{ height:100%; background:var(--accent,var(--ink)); transition:width .3s ease; }
  .mini-pct{ font-size:.76rem; color:var(--ink-soft); white-space:nowrap; }

  .section-list{ list-style:none; margin:0; padding:0 8px 6px; }
  .section-row{ border-top:1px solid var(--line); }
  .section-row:first-child{ border-top:none; }
  .row-main{ display:flex; align-items:center; gap:10px; padding:9px 6px; }
  .status-dot{ width:18px;height:18px;flex:0 0 18px; border-radius:50%; border:2px solid var(--todo); background:transparent; cursor:pointer; padding:0; transition:transform .12s ease, background .15s ease, border-color .15s ease; }
  .status-dot.small{ width:14px; height:14px; flex:0 0 14px; }
  .status-dot:active{ transform:scale(0.85); }
  .status-dot.status-doing{ border-color:var(--amber); background:linear-gradient(90deg,var(--amber) 50%,transparent 50%); }
  .status-dot.status-done{ border-color:var(--green); background:var(--green); }
  .section-title{ flex:1; text-align:left; background:none; border:none; font-family:'Inter'; font-size:.91rem; color:var(--ink); cursor:pointer; padding:2px 0; }
  .count{ font-size:.76rem; color:var(--ink-soft); white-space:nowrap; }
  .chev{ color:var(--ink-soft); font-size:.9rem; width:14px; text-align:center; flex:0 0 14px; }
  .leaf-list{ list-style:none; margin:0 0 10px 44px; padding:0; border-left:2px solid var(--line); }
  .leaf-row{ display:flex; align-items:center; gap:9px; padding:5px 0 5px 12px; }
  .leaf-text{ font-size:.85rem; color:var(--ink-soft); }

  .resource{ font-size:.74rem; color:var(--ink-soft); font-style:italic; margin:4px 16px 14px; }

  .reset-row{ text-align:right; margin:6px 2px 30px; }
  .reset-btn{ font-size:.76rem; color:var(--ink-soft); background:none; border:1px solid var(--line); border-radius:20px; padding:5px 13px; cursor:pointer; }
  .reset-btn.confirm{ color:#8a2e2e; border-color:#8a2e2e; }

  .loading{ color:var(--ink-soft); font-size:.9rem; padding:30px 0; }
  @media (max-width:460px){
    .kbo-tag{ display:none; }
    .roster-grade-stat{ width:64px; }
  }

.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login .add-input,.login .add-btn{width:100%}
.login .alt{background:none;color:var(--ink);border:1px solid var(--line)}
.err{color:#8a2e2e;font-size:.85rem;min-height:1.2em}
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.roster-remove{display:none}
.ro .status-dot{pointer-events:none}.ro .reset-row{display:none}
.stu .back-btn{display:none}

let roster = [];        // [{id,name}]

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function genId(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function val(status){ return status === 'done' ? 1 : status === 'doing' ? 0.5 : 0; }
function fmt(n){ return Number.isInteger(n) ? n : n.toFixed(1); }

function leafStatus(studentId, grade, lid){
  const b = (progress[studentId] && progress[studentId][grade]) || {};
  return b[lid] || 'todo';
}
function setLeafStatus(studentId, grade, lid, status){
  if (!progress[studentId]) progress[studentId] = {};
  if (!progress[studentId][grade]) progress[studentId][grade] = {};
  if (status === 'todo') delete progress[studentId][grade][lid];
  else progress[studentId][grade][lid] = status;
}

function sectionStats(studentId, grade, section){
  let done = 0;
  section.p.forEach((_, i) => done += val(leafStatus(studentId, grade, section.id + '#' + i)));
  return { done, total: section.p.length };
}
function blockStats(studentId, grade, block){
  let done = 0, total = 0;
  block.sections.forEach(s => { const st = sectionStats(studentId, grade, s); done += st.done; total += st.total; });
  return { done, total };
}
function gradeStats(studentId, grade){
  let done = 0, total = 0;
  DATA[grade].blocks.forEach(b => { const st = blockStats(studentId, grade, b); done += st.done; total += st.total; });
  return { done, total };
}
function studentOverall(studentId){
  const a = gradeStats(studentId, '7'), b = gradeStats(studentId, '8');
  return { done: a.done + b.done, total: a.total + b.total };
}
function classAveragePct(){
  if (roster.length === 0) return null;
  let sum = 0;
  roster.forEach(st => { const o = studentOverall(st.id); sum += o.total ? (o.done / o.total * 100) : 0; });
  return Math.round(sum / roster.length);
}

// ---------- rendering ----------

function renderLeaf(studentId, grade, sectionId, i, text){
  const lid = sectionId + '#' + i;
  const s = leafStatus(studentId, grade, lid);
  return '<li class="leaf-row">' +
    '<button class="status-dot small status-' + s + '" data-action="leaf" data-grade="' + grade + '" data-section="' + sectionId + '" data-idx="' + i + '" aria-label="Отметить подпункт"></button>' +
    '<span class="leaf-text">' + escapeHtml(text) + '</span>' +
  '</li>';
}

function renderSection(studentId, grade, section){
  const st = sectionStats(studentId, grade, section);
  const cls = st.done === 0 ? 'todo' : (st.done >= st.total ? 'done' : 'doing');
  const key = grade + ':' + section.id;
  const open = expandedTopics.has(key);
  let html = '<li class="section-row">' +
    '<div class="row-main">' +
      '<button class="status-dot status-' + cls + '" data-action="topic-bulk" data-grade="' + grade + '" data-section="' + section.id + '" aria-label="Отметить всю тему"></button>' +
      '<button class="section-title" data-action="expand" data-grade="' + grade + '" data-section="' + section.id + '">' + escapeHtml(section.t) + '</button>' +
      '<span class="count">' + fmt(st.done) + '/' + st.total + '</span>' +
      '<span class="chev">' + (open ? '\u2212' : '+') + '</span>' +
    '</div>';
  if (open){
    html += '<ul class="leaf-list">' + section.p.map((pt, i) => renderLeaf(studentId, grade, section.id, i, pt)).join('') + '</ul>';
  }
  html += '</li>';
  return html;
}

function renderBlock(studentId, grade, block){
  const st = blockStats(studentId, grade, block);
  const pct = st.total ? Math.round((st.done / st.total) * 100) : 0;
  const accentVar = grade === '7' ? 'var(--g7)' : 'var(--g8)';
  return '<section class="block" style="--accent:' + accentVar + '">' +
    '<div class="block-head">' +
      '<div class="block-title-wrap">' +
        '<h3 class="block-title">' + escapeHtml(block.t) + '</h3>' +
        '<span class="kbo-tag">' + escapeHtml(block.k) + '</span>' +
      '</div>' +
      '<div class="block-progress">' +
        '<div class="mini-bar"><div class="mini-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="mini-pct">' + fmt(st.done) + '/' + st.total + '</span>' +
      '</div>' +
    '</div>' +
    '<ul class="section-list">' + block.sections.map(s => renderSection(studentId, grade, s)).join('') + '</ul>' +
    '<p class="resource">Источник: ' + escapeHtml(block.r) + '</p>' +
  '</section>';
}

function renderRosterRow(st){
  const s7 = gradeStats(st.id, '7');
  const s8 = gradeStats(st.id, '8');
  const p7 = s7.total ? Math.round(s7.done / s7.total * 100) : 0;
  const p8 = s8.total ? Math.round(s8.done / s8.total * 100) : 0;
  return '<div class="roster-row">' +
    '<button class="roster-name" data-action="open-student" data-id="' + st.id + '">' + escapeHtml(st.name) + '</button>' +
    '<div class="roster-grades">' +
      '<div class="roster-grade-stat"><span class="roster-grade-label">7 кл · ' + p7 + '%</span><div class="roster-grade-bar"><div class="roster-grade-fill g7" style="width:' + p7 + '%"></div></div></div>' +
      '<div class="roster-grade-stat"><span class="roster-grade-label">8 кл · ' + p8 + '%</span><div class="roster-grade-bar"><div class="roster-grade-fill g8" style="width:' + p8 + '%"></div></div></div>' +
    '</div>' +
    '<button class="roster-remove' + (removeArmed === st.id ? ' confirm' : '') + '" data-action="remove-student" data-id="' + st.id + '">' + (removeArmed === st.id ? 'Точно?' : 'Удалить') + '</button>' +
  '</div>';
}

function makeCode(){

  ['7','8'].forEach(g=>DATA[g].blocks.forEach(b=>b.sections.forEach(sc=>sc.p.forEach((_,i)=>{const v=leafStatus(uid,g,sc.id+'#'+i);d+=v==='done'?'2':v==='doing'?'1':'0';}))));
  return btoa(unescape(encodeURIComponent(roster[0].name)))+'.'+d;
}
function parseCode(c){
  const [n,d]=c.trim().split('.');
  const name=decodeURIComponent(escape(atob(n)));
  const p={'7':{},'8':{}};let k=0;
  ['7','8'].forEach(g=>DATA[g].blocks.forEach(b=>b.sections.forEach(sc=>sc.p.forEach((_,i)=>{const v=d[k++];if(v==='1')p[g][sc.id+'#'+i]='doing';if(v==='2')p[g][sc.id+'#'+i]='done';}))));
  if(k!==d.length)throw new Error('len');
  return {name,p};
}

  html += '</div>';

  html += '<div class="legend">' +
    '<span><span class="dot-sample"></span>не начато</span>' +
    '<span><span class="dot-sample doing"></span>в процессе</span>' +
    '<span><span class="dot-sample done"></span>изучено</span>' +
  '</div>';

  html += '<div class="blocks">' + DATA[activeGrade].blocks.map(b => renderBlock(student.id, activeGrade, b)).join('') + '</div>';

  html += '<div class="reset-row"><button class="reset-btn' + (resetArmed === (student.id+activeGrade) ? ' confirm' : '') + '" data-action="reset" data-grade="' + activeGrade + '">' +
    (resetArmed === (student.id+activeGrade) ? 'Нажмите ещё раз для сброса' : 'Сбросить прогресс · ' + DATA[activeGrade].label) +
  '</button></div>';

  return html;
}


function loginView(){
  return '<div class="login"><h1 class="page-title">Трекер силлабуса КВО · Биология</h1><p class="page-sub">Выберите, как войти.</p>'+
  '<form data-action="student-login" class="login"><input class="add-input" name="n" placeholder="Ваше имя и фамилия" required /><button class="add-btn" type="submit">Войти как ученик</button></form>'+
  '<form data-action="admin-login" class="login"><input class="add-input" name="p" type="password" placeholder="Пароль учителя" required /><button class="add-btn alt" type="submit">Войти как учитель</button></form>'+
  '<form data-action="restore-code" class="login"><input class="add-input" name="c" placeholder="Код прогресса (восстановить на другом устройстве)" required /><button class="add-btn alt" type="submit">Восстановить по коду</button></form>'+
  '<div class="err">'+escapeHtml(err)+'</div></div>';
}
function render(){
  $app.className='wrap'+(mode==='admin'?' ro':'')+(mode==='student'?' stu':'');
  if(mode==='login'){$app.innerHTML=loginView();return;}
  let h='<div class="topbar"><button class="back-btn" data-action="logout">Выйти</button></div><h1 class="page-title">Трекер силлабуса КВО · Биология</h1>';
  h+='<p class="page-sub">'+(mode==='admin'?'Режим учителя: прогресс всех учеников (только просмотр, обновляется сам).':'Кружок у темы отмечает её целиком, разверните тему — чтобы отмечать подпункты. Всё сохраняется автоматически.')+'</p>';
  if(mode==='student')h+='<div class="roster-card" style="padding:12px 14px;margin-bottom:18px"><div class="hero-label">Код прогресса: скопируйте и отправьте учителю</div><textarea id="code" readonly class="add-input" style="width:100%;height:56px" onclick="this.select()">'+makeCode()+'</textarea></div>';
  h+=(mode==='student'||view==='student')?renderStudentView():renderOverview();
  $app.innerHTML=h;
}
function startStudent(name){
  let p={};
  try{const x=JSON.parse(localStorage.getItem('kbo-me')||'null');if(x&&x.name===name)p=x.p||{};}catch(e){}
  uid='me';roster=[{id:uid,name}];progress={};progress[uid]=p;
  activeStudentId=uid;activeGrade='7';mode='student';view='student';
  render();saveMine();
}
function startAdmin(){
  mode='admin';view='overview';
  unsub=db.collection('progress').onSnapshot(snap=>{
    roster=[];progress={};
    snap.docs.forEach(d=>{const x=d.data();roster.push({id:d.id,name:x.name||'?'});try{progress[d.id]=JSON.parse(x.p||'{}');}catch(e){progress[d.id]={};}});
    roster.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    render();
  },e=>{err='Нет доступа к данным';mode='login';render();});
  render();
}
$app.addEventListener('submit',async e=>{
  e.preventDefault();
  const a=e.target.dataset.action;
  if(a==='student-login'){
    const n=e.target.n.value.trim();if(!n)return;
    startStudent(n);
  }
  if(a==='restore-code'){
    try{const x=parseCode(e.target.c.value);try{localStorage.setItem('kbo-me',JSON.stringify({name:x.name,p:x.p}));}catch(z){}err='';startStudent(x.name);}catch(z){err='Код не подошёл';render();}
    return;
  }
  if(a==='import-code'){
    try{const x=parseCode(e.target.c.value);const id='s'+Array.from(x.name).reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7).toString(36);await db.doc('progress/'+id).set({name:x.name,p:JSON.stringify(x.p),t:Date.now()});err='';}catch(x){err='Код не подошёл или нет доступа';render();}
    return;
  }
  if(a==='admin-login'){
    if(e.target.p.value!==ADMIN_PASSWORD){err='Неверный пароль';render();return;}
    if(!db){err='Режим учителя: войдите в свой аккаунт claude.ai и откройте страницу из него';render();return;}
    err='';startAdmin();
  }
});
$app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(a==='logout'){if(unsub)unsub();unsub=null;mode='login';err='';roster=[];progress={};render();return;}
  if(a==='open-student'){activeStudentId=el.dataset.id;activeGrade='7';view='student';render();return;}
  if(a==='back'){view='overview';render();return;}
  if(a==='tab'){activeGrade=el.dataset.grade;render();return;}
  if(a==='expand'){const k=el.dataset.grade+':'+el.dataset.section;expandedTopics.has(k)?expandedTopics.delete(k):expandedTopics.add(k);render();return;}
  if(mode!=='student')return;
  if(a==='topic-bulk'){toggleSectionBulk(uid,el.dataset.grade,SECTION_INDEX[el.dataset.grade][el.dataset.section]);render();saveMine();return;}
  if(a==='leaf'){
    const g=el.dataset.grade,lid=el.dataset.section+'#'+el.dataset.idx,c=leafStatus(uid,g,lid);
    setLeafStatus(uid,g,lid,c==='todo'?'doing':c==='doing'?'done':'todo');render();saveMine();return;
  }
  if(a==='reset'){
    const g=el.dataset.grade,k=uid+g;
    if(resetArmed===k){progress[uid][g]={};resetArmed=null;render();saveMine();}
    else{resetArmed=k;render();setTimeout(()=>{if(resetArmed===k){resetArmed=null;render();}},3000);}
  }
});
function localDb(){const K='kbo-teacher';const get=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}');}catch(e){return {};}};const subs=[];
const emit=()=>{const o=get();const docs=Object.keys(o).map(id=>({id:id,data:()=>o[id]}));subs.forEach(f=>f({docs:docs}));};
return{doc:p=>({set:async d=>{const o=get();o[p.split('/')[1]]=d;try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}emit();}}),
collection:()=>({onSnapshot:f=>{subs.push(f);emit();return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1);};}})};}
(async function init(){
  try{db=await claude.use('db');user=await claude.use('user');uid=user?await user.id():null;}catch(e){db=null;}
  db=localDb();
  render();
})();

</script></body></html>
